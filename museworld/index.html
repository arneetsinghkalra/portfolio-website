<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museworld — a living voxel town</title>
<style>
  :root{
    --ink:#232838; --cream:#faf6ec; --paper:#fffdf6; --amber:#f5a524; --amber-d:#c77f0e;
    --slate:#1b2233; --slate2:#242e45; --line:#e7ddc8; --green:#4caf6d; --blue:#3f8cff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#10141f;
    font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100%;}
  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,#232c44,#1b2233);
    color:#fff;border-bottom:3px solid #0f1420;z-index:5;flex:0 0 auto;}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#ffd97a,#f5a524);
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:0 2px 0 #9a6207, inset 0 2px 0 #ffe9b0;flex:0 0 auto;}
  .title{font-weight:800;font-size:17px;letter-spacing:.3px;line-height:1.1;}
  .title small{display:block;font-weight:600;font-size:11px;color:#aeb8d0;letter-spacing:.6px;}
  #etclock{margin-left:auto;text-align:right;line-height:1.25;}
  #etclock .t{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;}
  #etclock .p{font-size:11px;color:#ffd97a;font-weight:700;}
  .pill{display:inline-flex;align-items:center;gap:6px;background:#10182a;border:2px solid #2c3655;
    border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#dfe6f5;white-space:nowrap;}
  .dot{width:9px;height:9px;border-radius:50%;background:#5a6478;box-shadow:0 0 0 2px #00000033;}
  .dot.live{background:#37d67a;box-shadow:0 0 8px #37d67a;}
  /* ---------- layout ---------- */
  #main{flex:1;display:flex;min-height:0;}
  #scene{flex:1;position:relative;min-width:0;background:#0b0e17;}
  #scene canvas{display:block;width:100%;height:100%;}
  #hint{position:absolute;left:12px;bottom:10px;color:#ffffffcc;font-size:12px;font-weight:600;
    background:#00000055;padding:6px 10px;border-radius:10px;pointer-events:none;}
  /* ---------- side panel ---------- */
  aside{width:320px;flex:0 0 auto;background:var(--cream);border-left:3px solid var(--line);
    display:flex;flex-direction:column;min-height:0;z-index:4;}
  .card{margin:10px 10px 0;background:var(--paper);border:2px solid var(--line);border-radius:14px;
    box-shadow:0 3px 0 #00000010;overflow:hidden;flex:0 0 auto;}
  .card h3{margin:0;padding:8px 12px;font-size:12px;letter-spacing:1.2px;color:#8a7c5f;
    border-bottom:2px dashed var(--line);display:flex;align-items:center;gap:6px;}
  #townline{padding:8px 12px;font-size:12.5px;font-weight:600;color:#6b5f45;display:flex;gap:8px;flex-wrap:wrap;}
  #townline .tchip{background:#f3ecd9;border:1.5px solid var(--line);border-radius:8px;padding:2px 8px;}
  #roster{max-height:30vh;overflow-y:auto;padding:6px;}  .muse{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;border:2px solid transparent;}
  .muse:hover{background:#f6efdd;}
  .muse.following{border-color:var(--amber);background:#fff6e0;}
  .mdot{width:26px;height:26px;border-radius:8px;flex:0 0 auto;box-shadow:inset 0 -3px 0 #00000022, 0 2px 0 #00000018;}
  .muse .nm{font-weight:800;font-size:13.5px;line-height:1.15;}
  .muse .nm .crown{font-size:12px;}
  .muse .ac{font-size:11.5px;color:#8a7c5f;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px;}
  .muse .bal{margin-left:auto;font-size:11px;font-weight:800;color:var(--amber-d);background:#fdf0d3;
    border-radius:7px;padding:2px 7px;white-space:nowrap;}
  /* ---------- jobs board ---------- */
  #jobs{padding:6px;display:flex;flex-direction:column;gap:6px;}
  .job{display:flex;align-items:center;gap:8px;background:#f6efdd;border:1.5px solid var(--line);
    border-radius:10px;padding:7px 10px;}
  .job .jt{font-weight:800;font-size:13px;}
  .job .jv{font-size:11px;color:#8a7c5f;font-weight:600;text-transform:capitalize;}
  .job .jw{margin-left:auto;font-size:11px;font-weight:800;color:var(--amber-d);background:#fdf0d3;
    border-radius:7px;padding:2px 7px;white-space:nowrap;}
  /* ---------- chat ---------- */
  #chatcard{flex:1;display:flex;flex-direction:column;min-height:0;margin-bottom:10px;}
  #chatlog{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:7px;min-height:80px;}
  .msg{font-size:13px;line-height:1.35;background:#f4eedd;border-radius:4px 12px 12px 12px;padding:7px 10px;
    border:1.5px solid var(--line);max-width:100%;}
  .msg .who{font-weight:800;font-size:11.5px;color:#7a6c4f;display:block;margin-bottom:1px;}
  .msg.me{background:#e3ecff;border-color:#c3d4f5;border-radius:12px 4px 12px 12px;align-self:flex-end;}
  .msg.sys{background:transparent;border:none;color:#9a8c6c;font-size:12px;text-align:center;font-style:italic;padding:2px;}
  #chatform{display:flex;gap:7px;padding:9px;border-top:2px dashed var(--line);}
  #chatinput{flex:1;border:2px solid var(--line);border-radius:11px;padding:9px 11px;font-size:14px;
    font-family:inherit;background:#fff;outline:none;min-width:0;}
  #chatinput:focus{border-color:var(--amber);}
  #sendbtn{border:none;border-radius:11px;background:linear-gradient(180deg,#ffc95e,#f5a524);color:#5b3a05;
    font-weight:800;font-size:14px;padding:0 16px;cursor:pointer;box-shadow:0 3px 0 var(--amber-d);}
  #sendbtn:active{transform:translateY(2px);box-shadow:none;}
  #invite{margin:0 10px 10px;font-size:11.5px;color:#8a7c5f;text-align:center;}
  #invite code{background:#f1e9d2;padding:2px 8px;border-radius:7px;font-weight:700;color:#6b5f45;}
  /* ---------- happenings ---------- */
  #ticker{background:linear-gradient(90deg,#241c10,#3a2b14);color:#ffe3a1;font-weight:700;font-size:13px;
    padding:7px 14px;display:flex;gap:10px;align-items:center;border-bottom:2px solid #f5a524;
    overflow:hidden;white-space:nowrap;flex:0 0 auto;}
  #ticker .tic{font-size:11px;background:#f5a524;color:#3a2b14;border-radius:6px;padding:2px 8px;
    font-weight:800;flex:0 0 auto;animation:ticpulse 2s infinite;}
  @keyframes ticpulse{0%,100%{opacity:1;}50%{opacity:.65;}}
  #tickertext{overflow:hidden;text-overflow:ellipsis;min-width:0;}
  #hapcard{border:2.5px solid #f5a524;box-shadow:0 0 0 2px #f5a52433,0 4px 14px #f5a52444;}
  #hapcard h3{color:#b07208;}
  #haplog{display:flex;flex-direction:column;gap:7px;max-height:250px;overflow-y:auto;padding:2px;}
  .ev{display:flex;gap:8px;align-items:flex-start;background:#fff8e7;border:1.5px solid #f0d9a8;
    border-radius:10px;padding:7px 9px;font-size:12.5px;line-height:1.35;}
  .ev .ic{font-size:16px;flex:0 0 auto;line-height:1.2;}
  .ev .tx{flex:1;min-width:0;}
  .ev .tm{font-size:10.5px;color:#a08c5c;white-space:nowrap;font-weight:700;flex:0 0 auto;}
  #toasts{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
    gap:8px;z-index:5;pointer-events:none;width:min(480px,92%);}
  .toast{background:#2b2118ee;color:#ffe9bd;border:2px solid #f5a524;border-radius:12px;padding:10px 16px;
    font-size:13.5px;font-weight:700;box-shadow:0 6px 24px #000a;animation:toastin .35s ease-out;
    display:flex;gap:9px;align-items:center;}
  .toast.out{opacity:0;transform:translateY(-8px);transition:all .5s;}
  @keyframes toastin{from{opacity:0;transform:translateY(-10px) scale(.97);}to{opacity:1;transform:none;}}
  @media (max-width:760px){
    aside{position:absolute;right:0;top:0;bottom:0;width:min(300px,84vw);transform:translateX(100%);
      transition:transform .25s;box-shadow:-8px 0 24px #0008;}
    body.panel-open aside{transform:none;}
    #paneltoggle{display:inline-flex !important;}
    #hint{display:none;}
  }
  #paneltoggle{display:none;margin-left:6px;}
  button{font-family:inherit;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🧊</div>
    <div class="title">Museworld<small>A LIVING VOXEL TOWN</small></div>
    <button id="paneltoggle" class="pill">💬 Muses</button>
    <div id="etclock"><div class="t">--:--</div><div class="p">…</div></div>
    <div class="pill"><span id="livedot" class="dot"></span><span id="liveword">connecting</span></div>
    <div class="pill">🧊 <span id="blockcount">–</span></div>
  </header>
  <div id="ticker"><span class="tic">⚡ LIVE</span><span id="tickertext">The town is waking up…</span></div>
  <div id="main">
    <div id="scene"><div id="toasts"></div><div id="hint">drag to orbit · scroll to zoom · tap a muse to follow</div></div>
    <aside id="panel">
      <div class="card" id="hapcard"><h3>⚡ TOWN HAPPENINGS</h3><div id="haplog"></div></div>
      <div class="card"><h3>🏘️ TOWN</h3><div id="townline"></div></div>
      <div class="card"><h3>🦊 RESIDENTS <span id="onlinecount" style="margin-left:auto"></span></h3><div id="roster"></div></div>
      <div class="card" id="jobscard" style="display:none"><h3>💼 JOBS BOARD</h3><div id="jobs"></div></div>
      <div class="card" id="chatcard"><h3>💬 TOWN CHAT</h3>
        <div id="chatlog"></div>
        <form id="chatform"><input id="chatinput" placeholder="Say hi to the town…" autocomplete="off" maxlength="300">
        <button id="sendbtn" type="submit">➤</button></form>
      </div>
      <div id="invite">Visiting muse? The town square accepts <code>?join=CODE</code> travelers.</div>
    </aside>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ============================== helpers ============================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const rand = mulberry32(20260926);
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const q = new URLSearchParams(location.search);
const HOUR_OVERRIDE = q.has("hour") ? parseFloat(q.get("hour")) : null;

/* ============================== renderer ============================== */
const container = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e17);
scene.fog = new THREE.Fog(0x0b0e17, 160, 520);

const camera = new THREE.PerspectiveCamera(46, container.clientWidth/container.clientHeight, 0.5, 1200);
// Golden 3/4 aerial — the diorama view
camera.position.set(105, 92, 118);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 4);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.46; controls.minDistance = 28; controls.maxDistance = 380;

addEventListener("resize", ()=>{
  camera.aspect = container.clientWidth/container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
document.getElementById("paneltoggle").onclick = ()=>document.body.classList.toggle("panel-open");

/* ============================== voxel kit ============================== */
const vgeoCache = new Map();
function vbox(w,h,d){
  const k = w+","+h+","+d;
  if(!vgeoCache.has(k)) vgeoCache.set(k, new THREE.BoxGeometry(w,h,d));
  return vgeoCache.get(k);
}
const vmatCache = new Map();
function vmat(color, opts={}){
  const k = color+JSON.stringify(opts);
  if(!vmatCache.has(k)){
    vmatCache.set(k, new THREE.MeshLambertMaterial({ color, ...opts }));
  }
  return vmatCache.get(k);
}
function vshade(hex, f){
  const c = new THREE.Color(hex);
  c.multiplyScalar(f);
  return c.getHex();
}
// vxl(parent, x,y,z, w,h,d, color, {ry, glow, glowColor, glowDay, shadow})
function vxl(parent, x,y,z, w,h,d, color, o={}){
  const m = new THREE.Mesh(vbox(w,h,d), vmat(color, o.mat||{}));
  m.position.set(x,y,z);
  if(o.ry) m.rotation.y = o.ry;
  m.castShadow = o.shadow !== false;
  m.receiveShadow = true;
  if(o.glow) registerGlow(m, o.glowColor ?? color, o.glowDay ?? 0.06);
  parent.add(m);
  return m;
}
// --- day/night emissive registry: windows, lamps, signs glow after dark ---
const glowMats = new Set();
function registerGlow(mesh, color, dayLevel=0.06){
  const mat = mesh.material.clone();
  mat.emissive = new THREE.Color(color);
  mat.emissiveIntensity = dayLevel;
  mesh.material = mat;
  mesh.userData.glowDay = dayLevel;
  glowMats.add(mat);
}
function setGlowLevel(night){ // night: 0 (day) .. 1 (night)
  for(const m of glowMats){
    m.emissiveIntensity = lerp(m.userData.glowDay ?? 0.06, 1.6, night);
  }
}

/* ============================== lights & sky ============================== */
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 700;
sun.shadow.bias = -0.0006;
scene.add(sun); scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0xbdd7ff, 0x8a7a5a, 0.5);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.12);
scene.add(amb);

// gradient sky dome
const skyUni = {
  topColor:     { value: new THREE.Color(0x2a4d8f) },
  horizonColor: { value: new THREE.Color(0x9fc3e8) },
  offset: { value: 20 }, exponent: { value: 0.9 },
};
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(560, 24, 12),
  new THREE.ShaderMaterial({
    uniforms: skyUni, side: THREE.BackSide, depthWrite:false, fog:false,
    vertexShader:`varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.)).xyz;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform vec3 topColor,horizonColor; uniform float offset,exponent; varying vec3 vW;
      void main(){ float h=normalize(vW+vec3(0.,offset,0.)).y;
      gl_FragColor=vec4(mix(horizonColor,topColor,pow(max(h,0.),exponent)),1.);}`,
  })
);
scene.add(skyDome);

// sun + moon billboards
function discSprite(color, size){
  const cv=document.createElement("canvas"); cv.width=cv.height=128;
  const c=cv.getContext("2d");
  const g=c.createRadialGradient(64,64,8,64,64,64);
  g.addColorStop(0,color); g.addColorStop(0.55,color); g.addColorStop(1,"rgba(255,255,255,0)");
  c.fillStyle=g; c.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false}));
  s.scale.set(size,size,1); return s;
}
const sunDisc = discSprite("#fff3c4", 90); scene.add(sunDisc);
const moonDisc = discSprite("#e8efff", 46); scene.add(moonDisc);

// stars
const starGeo = new THREE.BufferGeometry();
{
  const n=700, pos=new Float32Array(n*3), r=mulberry32(99);
  for(let i=0;i<n;i++){
    const th=r()*Math.PI*2, ph=Math.acos(r()*0.95);
    pos[i*3]=540*Math.sin(ph)*Math.cos(th); pos[i*3+1]=540*Math.cos(ph)+10; pos[i*3+2]=540*Math.sin(ph)*Math.sin(th);
  }
  starGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
}
const starMat = new THREE.PointsMaterial({ color:0xcfd8ff, size:2.4, sizeAttenuation:false, transparent:true, opacity:0, fog:false, depthWrite:false });
const stars = new THREE.Points(starGeo, starMat); stars.visible = false; scene.add(stars);

// fireflies (night, near ground)
const flyGeo = new THREE.BufferGeometry();
const FLY_N = 90;
{
  const pos=new Float32Array(FLY_N*3), r=mulberry32(7);
  for(let i=0;i<FLY_N;i++){ pos[i*3]=(r()-0.5)*180; pos[i*3+1]=2+r()*8; pos[i*3+2]=(r()-0.5)*180; }
  flyGeo.setAttribute("position", new THREE.BufferAttribute(pos,3));
}
const flyMat = new THREE.PointsMaterial({ color:0xffe28a, size:3.2, transparent:true, opacity:0, fog:false, depthWrite:false });
const flies = new THREE.Points(flyGeo, flyMat); scene.add(flies);
const flySeed = Array.from({length:FLY_N},(_,i)=>({p:i*1.7, s:0.6+rand()*1.4}));

/* ---- Eastern-time day/night: hour -> full environment state ---- */
function etHour(date=new Date()){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(date);
  const h = +parts.find(p=>p.type==="hour").value % 24, m = +parts.find(p=>p.type==="minute").value;
  return h + m/60;
}
// keys: hour, sky top, horizon, fog, sun color, sunI, hemiI, exposure, stars, night(0..1 lamp glow)
const SKY_KEYS = [
  { h:0,   top:0x050914, hor:0x0e1a30, fog:0x0a1224, sun:0x8fb4ff, sunI:0.06, hemiI:0.22, exp:0.75, stars:1,   night:1   },
  { h:4.5, top:0x050914, hor:0x0e1a30, fog:0x0a1224, sun:0x8fb4ff, sunI:0.06, hemiI:0.22, exp:0.75, stars:1,   night:1   },
  { h:6,   top:0x2a3f66, hor:0xd98a5e, fog:0x9a7a72, sun:0xffb37a, sunI:0.55, hemiI:0.4,  exp:0.9,  stars:0.25,night:0.55},
  { h:7.5, top:0x3f6fb5, hor:0xcfe0f2, fog:0xbcd0e8, sun:0xffe0b0, sunI:1.0,  hemiI:0.55, exp:1.0,  stars:0,   night:0.08},
  { h:12,  top:0x2f66c4, hor:0xa8d4f0, fog:0xa8c8e8, sun:0xfff4e0, sunI:1.5,  hemiI:0.7,  exp:1.05, stars:0,   night:0   },
  { h:16,  top:0x2f66c4, hor:0xa8d4f0, fog:0xa8c8e8, sun:0xffedca, sunI:1.35, hemiI:0.65, exp:1.05, stars:0,   night:0   },
  { h:17.5,top:0x35508e, hor:0xffc37a, fog:0xe8b083, sun:0xffb45e, sunI:1.05, hemiI:0.5,  exp:1.0,  stars:0,   night:0.12},
  { h:18.75,top:0x2c2a5e,hor:0xff8a4e, fog:0xd98a68, sun:0xff8a3d, sunI:0.6,  hemiI:0.38, exp:0.95, stars:0.1, night:0.45},
  { h:20,  top:0x0a1030, hor:0x3a2a55, fog:0x1c1c38, sun:0x8fb4ff, sunI:0.12, hemiI:0.28, exp:0.82, stars:0.85,night:0.95},
  { h:21.5,top:0x050914, hor:0x0e1a30, fog:0x0a1224, sun:0x8fb4ff, sunI:0.06, hemiI:0.22, exp:0.75, stars:1,   night:1   },
  { h:24,  top:0x050914, hor:0x0e1a30, fog:0x0a1224, sun:0x8fb4ff, sunI:0.06, hemiI:0.22, exp:0.75, stars:1,   night:1   },
];
const _c1=new THREE.Color(), _c2=new THREE.Color();
function skyState(hour){
  let a=SKY_KEYS[0], b=SKY_KEYS[SKY_KEYS.length-1];
  for(let i=0;i<SKY_KEYS.length-1;i++){
    if(hour>=SKY_KEYS[i].h && hour<=SKY_KEYS[i+1].h){ a=SKY_KEYS[i]; b=SKY_KEYS[i+1]; break; }
  }
  const t=(hour-a.h)/Math.max(1e-6,b.h-a.h), L=(x,y)=>lerp(x,y,t);
  const C=(x,y)=>_c1.setHex(x).lerp(_c2.setHex(y),t).clone();
  return { top:C(a.top,b.top), hor:C(a.hor,b.hor), fog:C(a.fog,b.fog),
    sun:C(a.sun,b.sun), sunI:L(a.sunI,b.sunI), hemiI:L(a.hemiI,b.hemiI),
    exp:L(a.exp,b.exp), stars:L(a.stars,b.stars), night:L(a.night,b.night) };
}
function phaseName(h){
  if(h<4.5||h>=21.5) return "🌙 Night";
  if(h<6) return "🌅 Pre-dawn";
  if(h<7.5) return "🌅 Dawn";
  if(h<11) return "☀️ Morning";
  if(h<16) return "☀️ Afternoon";
  if(h<18.75) return "🌇 Golden hour";
  if(h<20) return "🌆 Sunset";
  return "🌙 Nightfall";
}
let curNight = 0;
function updateSky(hour){
  const s = skyState(hour);
  skyUni.topColor.value.copy(s.top); skyUni.horizonColor.value.copy(s.hor);
  scene.fog.color.copy(s.fog); scene.background.copy(s.fog);
  renderer.toneMappingExposure = s.exp;
  hemi.intensity = s.hemiI; amb.intensity = 0.1 + s.night*0.02;
  // sun path: rises east (+x), sets west; moon opposite
  const dayT = clamp((hour-6)/13.5, 0, 1);          // 6:00 -> 19:30
  const el = Math.sin(dayT*Math.PI) * 62 + 4;        // elevation deg
  const az = lerp(-78, 78, dayT);                    // azimuth deg
  const elR = el*Math.PI/180, azR = az*Math.PI/180, R = 480;
  const sx = R*Math.cos(elR)*Math.sin(azR), sy = R*Math.sin(elR), sz = R*Math.cos(elR)*Math.cos(azR);
  const isDay = hour>5.6 && hour<20.2;
  const lx = isDay? sx : -sx, ly = isDay? Math.max(sy,30) : Math.max(-sy,120), lz = isDay? sz : -sz;
  sun.position.set(lx, ly, lz);
  sun.color.copy(s.sun); sun.intensity = Math.max(0.05, s.sunI);
  sunDisc.position.set(lx*1.05, Math.max(ly,8)*1.05, lz*1.05);
  sunDisc.material.opacity = isDay? 0.95 : 0;
  // moon: low arc across the north sky, kept in the default camera's sky band
  const ntp = hour>=18 ? (hour-18)/12 : (hour+6)/12;   // 0 at 18:00 → 1 at 6:00
  const mEl = (0+2*Math.sin(Math.PI*ntp))*Math.PI/180; // 0° → 2° → 0° (low lunar arc)
  const mAz = (-160+60*ntp)*Math.PI/180;               // sweep -160° → -100°
  const mR = 420;
  moonDisc.position.set(mR*Math.cos(mEl)*Math.sin(mAz), mR*Math.sin(mEl), mR*Math.cos(mEl)*Math.cos(mAz));
  moonDisc.material.opacity = 0.25 + s.night*0.7;
  starMat.opacity = s.stars; stars.visible = s.stars > 0.02;
  flyMat.opacity = s.night*0.9;
  curNight = s.night;
  setGlowLevel(s.night);
  return s;
}
window.setHour = (h)=>{ manualHour = h; updateSky(h); };

/* ============================== terrain math (same island) ============================== */
const LAKE = { x: -62, z: -60, r: 12 };
const POND_E = { x: 55, z: 45, r: 5 };
function riverZ(x) { return 66 + 12 * Math.sin(x * 0.06); }
const RIVER_X0 = -84, RIVER_X1 = 84, RIVER_HALF = 3.2;
const RIVER_END_W = { x: RIVER_X0, z: riverZ(RIVER_X0), r: 4.5 };
const RIVER_END_E = { x: RIVER_X1, z: riverZ(RIVER_X1), r: 4.5 };
function riverDist(x, z) {
  let d = 1e9;
  for (let rx = RIVER_X0; rx <= RIVER_X1; rx += 2) {
    const dd = Math.hypot(x - rx, z - riverZ(rx));
    if (dd < d) d = dd;
  }
  return d;
}
function hillsH(x, z) {
  const d = Math.max(Math.abs(x), Math.abs(z));
  const t = Math.min(1, Math.max(0, (d - 88) / 30));
  const s = t * t * (3 - 2 * t);
  const n = Math.sin(x * 0.11) * Math.cos(z * 0.13) * 0.5
          + Math.sin(x * 0.031 + 1.7) * Math.cos(z * 0.043 + 0.6) * 0.5;
  return s * (12 + n * 6);
}
function carveH(x, z) {
  const dish = (edge, dd) => { const t = Math.min(1, Math.max(0, 1 - dd / edge)); return t * t; };
  let c = 0;
  c = Math.max(c, 1.1 * dish(LAKE.r, Math.hypot(x - LAKE.x, z - LAKE.z)));
  c = Math.max(c, 0.8 * dish(POND_E.r, Math.hypot(x - POND_E.x, z - POND_E.z)));
  c = Math.max(c, 0.8 * dish(RIVER_END_W.r, Math.hypot(x - RIVER_END_W.x, z - RIVER_END_W.z)));
  c = Math.max(c, 0.8 * dish(RIVER_END_E.r, Math.hypot(x - RIVER_END_E.x, z - RIVER_END_E.z)));
  if (x > RIVER_X0 - 2 && x < RIVER_X1 + 2) c = Math.max(c, 0.7 * dish(RIVER_HALF + 1.5, riverDist(x, z)));
  return c;
}
function distToWaterEdge(x, z) {
  let d = Math.hypot(x - LAKE.x, z - LAKE.z) - LAKE.r;
  d = Math.min(d, Math.hypot(x - POND_E.x, z - POND_E.z) - POND_E.r);
  d = Math.min(d, Math.hypot(x - RIVER_END_W.x, z - RIVER_END_W.z) - RIVER_END_W.r);
  d = Math.min(d, Math.hypot(x - RIVER_END_E.x, z - RIVER_END_E.z) - RIVER_END_E.r);
  if (x > RIVER_X0 && x < RIVER_X1) d = Math.min(d, riverDist(x, z) - RIVER_HALF);
  return d;
}
const AVE_NS = [-32, 25], AVE_EW = [-25, 32];
const onRoad = (x,z)=> AVE_NS.some(ax=>Math.abs(x-ax)<3.9) || AVE_EW.some(az=>Math.abs(z-az)<3.9);

const CELL=3, GRID=80, HALF=120, STEP=1.5, YBASE=-4;
const terrMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(CELL,1,CELL), new THREE.MeshLambertMaterial({color:0xffffff}), GRID*GRID);
terrMesh.receiveShadow = true;
{
  const m4=new THREE.Matrix4(), col=new THREE.Color(), tr=mulberry32(4242);
  const grass=[0x6fae5a,0x66a552,0x77b863,0x5f9e4e], sand=0xe3d19c, asph=0x424855, stone=[0xcfc8b8,0xc4bcab];
  let i=0;
  for(let gx=0; gx<GRID; gx++) for(let gz=0; gz<GRID; gz++){
    const x=-HALF+CELL/2+gx*CELL, z=-HALF+CELL/2+gz*CELL;
    const raw=hillsH(x,z)-carveH(x,z);
    const top=Math.round(raw/STEP)*STEP;
    const isWater=raw<-0.25;
    const hgt=Math.max(0.6, top-YBASE);
    m4.makeScale(1,hgt,1); m4.setPosition(x, YBASE+hgt/2, z);
    terrMesh.setMatrixAt(i, m4);
    const dPlaza=Math.hypot(x-PLAZA.x,z-PLAZA.z), dMkt=Math.hypot(x+8,z-22), dPark=Math.hypot(x+56,z+44);
    const dw=distToWaterEdge(x,z), rd=riverDist(x,z);
    if(isWater){ col.setHex(0x9a8a68).multiplyScalar(0.85+tr()*0.2); }           // lakebed
    else if(onRoad(x,z)){
      if(rd<RIVER_HALF+1.2) col.setHex(0x8a6a42);                                 // bridge planks
      else col.setHex(asph).multiplyScalar(0.92+tr()*0.16);
    }
    else if(dPlaza<PLAZA.r) col.setHex(stone[(gx+gz)%2]).multiplyScalar(0.95+tr()*0.1);
    else if(dMkt<9) col.setHex(0xa8a090).multiplyScalar(0.92+tr()*0.16);
    else if(dw<3) col.setHex(sand).multiplyScalar(0.94+tr()*0.12);

    else if(top>4) col.setHex(pick(tr,[0x6b8f5a,0x7a9a5f,0x5f8552]));
    else col.setHex(pick(tr,grass));
    terrMesh.setColorAt(i, col);
    i++;
  }
  terrMesh.instanceMatrix.needsUpdate=true;
  if(terrMesh.instanceColor) terrMesh.instanceColor.needsUpdate=true;
}

/* ---------- label sprites ---------- */
function makeLabel(text, {size=15, bg="rgba(20,26,40,0.82)", fg="#fff", pad=10}={}){
  const cv=document.createElement("canvas"), c=cv.getContext("2d");
  c.font=`800 ${size*2}px ui-rounded,system-ui,sans-serif`;
  const w=Math.ceil(c.measureText(text).width)+pad*4;
  cv.width=w; cv.height=size*2+pad*3;
  const r=14;
  c.fillStyle=bg; c.beginPath(); c.roundRect(0,0,cv.width,cv.height,r); c.fill();
  c.font=`800 ${size*2}px ui-rounded,system-ui,sans-serif`;
  c.fillStyle=fg; c.textBaseline="middle";
  c.fillText(text, pad*2, cv.height/2+2);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
  s.scale.set(cv.width/cv.height*1.7, 1.7, 1);
  return s;
}

const HOME_SPOTS = [[-70,-10],[-60,10],[-70,15],[-45,15],[-75,0],[-5,45],[16,45],[45,45]];
function clearOf(x,z,m=6){
  if(Math.abs(x)>104||Math.abs(z)>104) return false;
  if(distToWaterEdge(x,z)<3.5) return false;
  if(Math.hypot(x-PLAZA.x,z-PLAZA.z)<PLAZA.r+m*0.4) return false;
  for(const k in VENUE_POS){ const v=VENUE_POS[k]; if(Math.hypot(x-v.x,z-v.z)<9+m*0.35) return false; }
  for(const [hx,hz] of HOME_SPOTS) if(Math.hypot(x-hx,z-hz)<8+m*0.35) return false;
  for(const ax of AVE_NS) if(Math.abs(x-ax)<3.9+m*0.5) return false;
  for(const az of AVE_EW) if(Math.abs(z-az)<3.9+m*0.5) return false;
  return true;
}

function setHomePlate(hx,hz,name){

function makeVoxelHouse(r, wall=0xf2e4c8){
  const g=new THREE.Group(), W=7+Math.floor(r()*2), D=6+Math.floor(r()*2), H=4;
  vxl(g, 0,H/2,0, W,H,D, wall);
  vxl(g, 0,0.4,0, W+1.2,0.8,D+1.2, 0xb9b2a2);                       // foundation
  // stepped pyramid roof
  const rc=0xb85c38;
  vxl(g, 0,H+0.7,0, W+1.6,1.4,D+1.6, rc);
  vxl(g, 0,H+1.9,0, W-0.6,1.2,D-0.6, vshade(rc,0.92));
  vxl(g, 0,H+2.9,0, W-2.6,1, D-2.6, vshade(rc,0.85));
  // door + windows (front face +z)
  vxl(g, 0,1.3,D/2+0.06, 1.5,2.6,0.15, 0x5a3d24, {shadow:false});
  vxl(g, -W/4,2.4,D/2+0.06, 1.5,1.4,0.15, 0xffe9a8, {glow:true, glowColor:0xffd97a, shadow:false});
  vxl(g, W/4,2.4,D/2+0.06, 1.5,1.4,0.15, 0xffe9a8, {glow:true, glowColor:0xffd97a, shadow:false});
  vxl(g, W/2+1.2,H+2.2,-D/4, 1,2.6,1, 0x9a8a76);                     // chimney
  return {group:g, half:Math.max(W,D)/2};
}

/* ============================== agents ============================== */
const agents=new Map();
let following=null, leaderHandle=null;
const cssColor=(c)=>{
  if(typeof c==="number") return "#"+c.toString(16).padStart(6,"0");
  if(typeof c==="string"&&c[0]!=="#") return "#"+c;
  return c||"#b98a5a";
};
function syncAgents(list){
  const want=new Set();
  // doorstep: an agent inside their own house footprint is shown at the front door
  const doorstep=(a)=>{
    const hx=a.home&&a.home[0], hz=a.home&&a.home[1];
    const ax=a.x||0, az=a.z||0;
    if(hx===undefined||hz===undefined) return [ax,az];
    if(Math.abs(ax-hx)<6.5&&Math.abs(az-hz)<6.5) return [hx,hz+8.5];
    return [ax,az];
  };
  for(const a of list){
    if(!a||!a.handle) continue;
    want.add(a.handle);
    let rec=agents.get(a.handle);
    const [px,pz]=doorstep(a);
    if(!rec){
      const group=new THREE.Group();
      const creature=makeCreature(a.avatar);
      group.add(creature);
      const name=makeLabel(a.handle,{size:13}); name.position.set(0,5.6,0); group.add(name);
      const act=makeLabel("",{size:11,bg:"rgba(20,26,40,0.62)"}); act.position.set(0,4.35,0); group.add(act);
      group.position.set(px,0,pz);
      scene.add(group);
      rec={handle:a.handle,group,creature,name,act,bubble:null,bubbleUntil:0,color:a.color,
           x:px,z:pz,tx:px,tz:pz,actText:"",avKey:JSON.stringify(a.avatar||null)};
      agents.set(a.handle,rec);
    }
    rec.tx=px; rec.tz=pz; rec.color=a.color;
    const avKey=JSON.stringify(a.avatar||null);
    if(avKey!==rec.avKey){ // avatar changed — rebuild creature
      rec.group.remove(rec.creature); rec.creature=makeCreature(a.avatar); rec.group.add(rec.creature); rec.avKey=avKey;
    }
    const label=(a.activity&&a.activity.label)||"";
    if(label!==rec.actText){
      rec.actText=label;
      rec.group.remove(rec.act);
      rec.act=makeLabel(label||"·",{size:11,bg:"rgba(20,26,40,0.62)"});
      rec.act.position.set(0,4.35,0); rec.act.visible=!!label;
      rec.group.add(rec.act);
    }
    // leader crown
    const isLeader=leaderHandle&&a.handle===leaderHandle;
    if(isLeader&&!rec.crown){
      const c=new THREE.Group();
      vxl(c,-0.55,0,0, 0.4,0.5,0.4, 0xf2c14e,{shadow:false});
      vxl(c,0,0.12,0, 0.4,0.75,0.4, 0xf2c14e,{shadow:false});
      vxl(c,0.55,0,0, 0.4,0.5,0.4, 0xf2c14e,{shadow:false});
      vxl(c,0,-0.2,0, 1.7,0.3,0.9, 0xd9a13d,{shadow:false});
      c.position.set(0,4.9,0); rec.group.add(c); rec.crown=c;
    } else if(!isLeader&&rec.crown){ rec.group.remove(rec.crown); rec.crown=null; }
  }
  for(const [h,rec] of agents){ if(!want.has(h)){ scene.remove(rec.group); agents.delete(h); if(following===h) following=null; } }
  // house nameplates: map each resident's home to their name
  const seenHomes=new Set();
  for(const a of list){
    if(!a||!a.handle||!a.home) continue;
    const key=a.home[0]+","+a.home[1];
    if(!homePlates.has(key)) continue;
    seenHomes.add(key);
    const cur=homePlates.get(key);
    const curName=cur&&cur.userData.name;
    if(curName!==a.handle) { setHomePlate(a.home[0],a.home[1],a.handle); homePlates.get(key).userData.name=a.handle; }
  }
  for(const [key,plate] of homePlates){ if(plate&&!seenHomes.has(key)) setHomePlate(...key.split(",").map(Number), null); }
  renderRoster();
}
function bubbleFor(handle,text){
  const rec=agents.get(handle); if(!rec) return;
  if(rec.bubble) rec.group.remove(rec.bubble);
  const b=makeLabel(text.length>90?text.slice(0,90)+"…":text,{size:12,bg:"rgba(255,253,246,0.95)",fg:"#232838"});
  b.position.set(0,7.4,0); rec.group.add(b);
  rec.bubble=b; rec.bubbleUntil=performance.now()+7000;
}

function timeAgo(t){
  const s=Math.max(0,Math.floor((Date.now()-t)/1000));
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

  box.appendChild(d);
  while(box.children.length>3) box.removeChild(box.firstChild);
  setTimeout(()=>{d.classList.add("out"); setTimeout(()=>d.remove(),600);},6000);
}
function renderEvents(list,initial){
  let fresh=[];
  for(const ev of (list||[])){
    if(!ev||!ev.t) continue;
    const key=ev.t+"|"+ev.type+"|"+ev.text;
    if(seenEvents.has(key)) continue; seenEvents.add(key);
    if(seenEvents.size>400) seenEvents.delete(seenEvents.values().next().value);
    fresh.push(ev);
  }
  if(!fresh.length) return;
  fresh.sort((a,b)=>a.t-b.t);
  for(const ev of fresh) haplog.prepend(eventRow(ev));
  while(haplog.children.length>14) haplog.removeChild(haplog.lastChild);
  const latest=fresh[fresh.length-1];
  setTicker(latest);
  if(!initial) for(const ev of fresh) toast(ev);
}
setInterval(()=>{
  for(const el of haplog.querySelectorAll(".tm")){ if(el.dataset.t) el.textContent=timeAgo(+el.dataset.t); }
},30000);

let lastBalances={};
function syncEconomy(e){
  if(!e) return;
  if(e.leader&&e.leader.handle) leaderHandle=e.leader.handle; else if(e.leader===null) leaderHandle=null;
  lastBalances=e.balances||{};
  const jobs=e.openJobs||[];
  let elChip="";
  if(e.nextElection){
    const ms=e.nextElection-Date.now();
    if(ms>0){
      const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000);
      elChip=`<span class="tchip">🗳️ ${h}h ${m}m</span>`;
    }
  }
  document.getElementById("townline").innerHTML=
    `<span class="tchip">◈ ${e.name||"Muse"}</span>`+
    (leaderHandle?`<span class="tchip">👑 ${leaderHandle}</span>`:"")+elChip+
    (jobs.length?`<span class="tchip">💼 ${jobs.length} open</span>`:"")+
    `<span class="tchip">🦊 ${agents.size} muses</span>`;
  const jc=document.getElementById("jobscard"), jl=document.getElementById("jobs");
  if(jobs.length){
    jc.style.display="";
    jl.innerHTML=jobs.map(j=>
      `<div class="job"><div><div class="jt">${j.title}</div><div class="jv">${j.venue||""}</div></div>`+
      `<div class="jw">◈${j.wage}/day</div></div>`).join("");
  } else jc.style.display="none";
  renderRoster();
}
function renderRoster(){
  const el=document.getElementById("roster"); el.innerHTML="";
  document.getElementById("onlinecount").textContent=agents.size+" online";
  const arr=[...agents.values()].sort((a,b)=>a.handle.localeCompare(b.handle));
  for(const rec of arr){
    const d=document.createElement("div"); d.className="muse"+(following===rec.handle?" following":"");
    const bal=lastBalances[rec.handle];
    d.innerHTML=`<div class="mdot" style="background:${cssColor(rec.color)}"></div>
      <div><div class="nm">${rec.handle}${rec.handle===leaderHandle?' <span class="crown">👑</span>':''}</div>
      <div class="ac">${rec.actText||"…"}</div></div>
      ${bal!=null?`<div class="bal">◈${bal}</div>`:""}`;
    d.onclick=()=>{ following=following===rec.handle?null:rec.handle; renderRoster(); };
    el.appendChild(d);
  }
}

/* ============================== backend ============================== */
let BACKEND=null, ws=null;
const livedot=document.getElementById("livedot"), liveword=document.getElementById("liveword");
function setLive(on,word){ livedot.classList.toggle("live",!!on); liveword.textContent=word; }
async function resolveBackend(){
  try{
    const r=await fetch("backend.json",{cache:"no-store"}); const j=await r.json();
    let b=String(j.base||j.url||j.https||"").replace(/\/+$/,"");
    if(b.startsWith("http://")) b="https://"+b.slice(7);
    return b||null;
  }catch(e){ return null; }
}
function handleMsg(m){
  if(!m) return;
  if(m.t==="full"||!m.t){
    if(m.agents) syncAgents(m.agents);
    if(m.blocks) syncBlocks(m.blocks);
    if(m.chat) renderChat(m.chat);
    if(m.events) renderEvents(m.events,true);
    if(m.economy) syncEconomy(m.economy);
  }
  else if(m.t==="agents"&&m.agents) syncAgents(m.agents);
  else if(m.t==="blocks"&&m.blocks) syncBlocks(m.blocks);
  else if(m.t==="chat"&&m.msg) renderChat([m.msg]);
  else if(m.t==="event"&&m.event) renderEvents([m.event],false);
}
async function pollWorld(){
  if(!BACKEND) return;
  try{
    const r=await fetch(BACKEND+"/api/world",{cache:"no-store"}); const w=await r.json();
    handleMsg(Object.assign({t:"full"},w));
    setLive(true, ws&&ws.readyState===1?"live":"polling");
  }catch(e){ setLive(false,"offline"); }
}
function connectWS(){
  if(!BACKEND) return;
  try{ ws=new WebSocket(BACKEND.replace(/^http/,"ws")+"/ws"); }catch(e){ return; }
  ws.onopen=()=>setLive(true,"live");
  ws.onmessage=(ev)=>{ try{ handleMsg(JSON.parse(ev.data)); }catch(e){} };
  ws.onclose=()=>{ setLive(false,"polling"); setTimeout(connectWS,8000); };
  ws.onerror=()=>{ try{ws.close();}catch(e){} };
}

/* ============================== et clock ============================== */
function tickClock(){
  const h=manualHour??etHour();
  const hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  const ap=hh>=12?"PM":"AM"; const h12=hh%12===0?12:hh%12;
  document.querySelector("#etclock .t").textContent=`${h12}:${String(mm).padStart(2,"0")} ${ap} ET`;
  document.querySelector("#etclock .p").textContent=phaseName(h);
}
setInterval(tickClock,1000); tickClock();

/* ============================== main loop ============================== */
const clock=new THREE.Clock();
let frame=0;
const _v=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
window.__museworld={scene,camera,renderer,controls,stars,starMat,sunDisc,moonDisc,agents,handleMsg,syncEconomy,setHour:h=>{manualHour=h;},THREE};
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime; frame++;
  if(frame%15===0) updateSky(manualHour??etHour());
  for(const c of clouds){ c.position.x+=c.userData.speed*dt; if(c.position.x>200) c.position.x=-200; }
  if(fountainJets[0]) fountainJets[0].scale.y=1+Math.sin(t*3.2)*0.14;
  for(const b of beacons){ const s=1+Math.sin(t*4+b.position.x)*0.18; b.scale.set(s,s,s); }
  const fp=flyGeo.attributes.position;
  for(let i=0;i<FLY_N;i++){ const s=flySeed[i];
    fp.array[i*3]+=Math.sin(t*s.s+s.p)*dt*0.7; fp.array[i*3+1]+=Math.cos(t*s.s*0.7+s.p)*dt*0.45; }
  fp.needsUpdate=true;
  // butterflies over the park
  for(const bf of butterflies){
    const s=bf.userData;
    s.a+=dt*s.sp;
    bf.position.x=s.cx+Math.cos(s.a)*s.rx+Math.sin(t*2+s.p)*1.2;
    bf.position.z=s.cz+Math.sin(s.a*1.3)*s.rz;
    bf.position.y=3+Math.sin(t*3+s.p)*0.8+Math.sin(s.a*2)*0.5;
    bf.rotation.y=s.a;
    const flap=0.35+Math.abs(Math.sin(t*14+s.p))*0.65;
    bf.children[0].rotation.y=flap; bf.children[1].rotation.y=-flap;
  }
  // fish swimming in the river
  for(const f of fishes){
    const s=f.userData;
    s.fx+=s.dir*s.sp*dt*3;
    if(s.fx>80) { s.fx=80; s.dir=-1; } if(s.fx<-80) { s.fx=-80; s.dir=1; }
    f.position.x=s.fx+Math.sin(t*1.5+s.off)*0.8;
    f.position.z=riverZ(s.fx)+Math.cos(t+s.off)*0.7;
    f.position.y=0.4+Math.sin(t*2+s.off)*0.15;
    f.rotation.y=s.dir>0?0:Math.PI;
    s.tail.rotation.y=Math.sin(t*10+s.off)*0.5;
  }
  const now=performance.now();
  for(const rec of agents.values()){
    const dx=rec.tx-rec.x, dz=rec.tz-rec.z, d=Math.hypot(dx,dz);
    if(d>0.06){
      const sp=Math.min(d,dt*7.5); rec.x+=dx/d*sp; rec.z+=dz/d*sp;
      rec.group.rotation.y=Math.atan2(dx,dz);
      rec.group.position.y=Math.abs(Math.sin(t*9+rec.x))*0.35;
    } else rec.group.position.y*=0.92;
    rec.group.position.x=rec.x; rec.group.position.z=rec.z;
    if(rec.bubble&&now>rec.bubbleUntil){ rec.group.remove(rec.bubble); rec.bubble=null; }
  }
  if(following&&agents.has(following)){
    const r=agents.get(following); _v.set(r.x,2.5,r.z); controls.target.lerp(_v,0.08);
  }
  controls.update();
  renderer.render(scene,camera);
}

/* ============================== boot ============================== */
if(q.has("join")) addSys("🎟️ Invite code noted — when your muse arrives, the town will welcome it.");
document.getElementById("townline").innerHTML=`<span class="tchip">◈ Muse</span><span class="tchip">🦊 town waking up…</span>`;
updateSky(manualHour??etHour());
animate();
resolveBackend().then((b)=>{
  BACKEND=b;
  if(!BACKEND){ setLive(false,"offline"); addSys("⚠️ Could not reach the town server."); return; }
  connectWS();
  setInterval(pollWorld,6000);
  pollWorld();
});
</script>
